<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA-Chip Labor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: freundlich-klar, ein Laborpraktikum für die Oberstufe
   IDEA: Laborbank mit Regal – man holt Reagenzien, startet die Reaktion, der Chip leuchtet
   PICTURE: Regal + Arbeitsfläche, farbiger Chip mit rot/grün/gelb/schwarz leuchtenden Punkten
   COLOUR and TYPE: Nachtblau-Labor, Grün = gesund, Rot = Tumor, Gelb = beide; Atkinson Hyperlegible
   LAYOUT: Kopfzeile mit Fortschritt, Inhalt in einer Karte, Navigation unten */
:root{color-scheme:light dark;
--bg:light-dark(#eef3f7,#0d1520);--card:light-dark(#ffffff,#152232);--ink:light-dark(#0f1c2b,#e6eef6);--mut:light-dark(#4b5d70,#9fb2c5);
--line:light-dark(#d5dfe8,#2a3b4f);--nav:#0f2236;--acc:#1f7ae0;--g:#16a34a;--r:#dc2626;--y:#eab308;--wood:light-dark(#b98a55,#7a5633);--shelf:light-dark(#f6ead9,#2a2117)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
header{background:var(--nav);color:#fff;padding:12px max(3vw,14px);display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1 1 220px}
#dots{display:flex;gap:6px;flex-wrap:wrap}
#dots button{width:28px;height:28px;border-radius:50%;border:2px solid #4d6a88;background:transparent;color:#cfe0f1;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer;padding:0}
#dots button.done{background:#2f5d8a;border-color:#2f5d8a}#dots button.cur{background:#fff;color:var(--nav);border-color:#fff}
#dots button:disabled{opacity:.35;cursor:default}
main{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,32px) max(3vw,12px) 110px}
.kind{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;margin-bottom:8px}
.kind.lab{background:#dcfce7;color:#166534}.kind.ex{background:#fef3c7;color:#92400e}.kind.ab{background:#ede9fe;color:#5b21b6}
h2{font-size:clamp(26px,3.4vw,40px);line-height:1.08;margin:0 0 14px;text-wrap:balance}
h3{font-size:20px;margin:18px 0 8px}
p{max-width:72ch;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.4vw,28px)}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:start}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.fig svg{width:100%;height:auto;display:block}
.note{border-left:5px solid var(--acc);background:light-dark(#eef5ff,#13283f);padding:10px 14px;border-radius:8px;margin:12px 0}
.g{color:var(--g);font-weight:700}.r{color:var(--r);font-weight:700}.y{color:#b48a00;font-weight:700}
.seq{font:500 15px "Fira Code",monospace;letter-spacing:.06em}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;padding:10px max(3vw,12px);z-index:5}
.btn{font-weight:700;font-size:17px;font-family:inherit;min-height:46px;padding:0 20px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
/* Labor */
.lab{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}.bench{order:-1}}
.shelf{background:var(--shelf);border-radius:14px;padding:12px 12px 4px;border:1px solid var(--line)}
.shelf h3{margin:0 0 8px;font-size:16px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px 8px;padding-bottom:10px;border-bottom:9px solid var(--wood);margin-bottom:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 4px 6px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;line-height:1.2;font-family:inherit;color:var(--ink);min-height:104px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.item svg{width:46px;height:46px}.item:hover{transform:translateY(-3px)}
.item.sel{opacity:.35;transform:none}
.bench{background:light-dark(#e8eef4,#1b2a3b);border-radius:14px;padding:14px;border:1px solid var(--line);position:relative;min-height:260px}
.task{background:var(--card);border-radius:12px;padding:12px 14px;border:2px dashed var(--acc);margin-bottom:12px}
.onbench{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;align-items:flex-start}
.onbench .item{min-height:auto;width:96px;font-size:12px}.onbench .item svg{width:34px;height:34px}
.carry{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px;color:var(--mut)}
.carry span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:16px}
.fb.bad{background:light-dark(#fee2e2,#3a1517);border:1px solid #fca5a5}.fb.ok{background:light-dark(#dcfce7,#11301d);border:1px solid #86efac}
.run{text-align:center;padding:10px}.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:10px auto;max-width:420px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--acc),var(--r))}
.shake{animation:sh .5s infinite}@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.choice{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.choice button{font-weight:700;font-size:15px;font-family:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.choice button.right{border-color:var(--g);background:light-dark(#dcfce7,#11301d)}.choice button.wrong{border-color:var(--r);background:light-dark(#fee2e2,#3a1517)}
.spotq{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:56px;height:56px;border-radius:50%;box-shadow:0 0 18px currentColor;border:3px solid #0b1220}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:center}
.arr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;max-width:330px}
.arr div{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#111827;border:2px solid #334155}
.arr div.h{background:transparent;border:0;color:var(--ink);border-radius:0}
.arr div.on{background:var(--y);color:#111;box-shadow:0 0 10px var(--y)}
.scroll{overflow-x:auto}.scroll table{min-width:620px}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
summary{cursor:pointer;font-weight:700}
.scan{animation:scan 2.4s linear}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(260px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>DNA-Chip-Labor · Genaktivität sichtbar machen</h1><button id="ovb" class="btn" style="min-height:36px;padding:0 14px;font-size:15px;background:#fff;color:#0f2236;border-color:#fff">☰ Übersicht</button><div id="dots"></div></header>
<main id="view"></main>
<nav class="bot"><button class="btn ghost" id="prev">← Zurück</button><button class="btn" id="next">Weiter →</button></nav>
<script>
{
// ---------- Daten ----------
const ITEMS={
gewebe_g:{n:'Gewebeprobe gesund',ic:'dish',c:'#f4a6a6',d:'Gewebe einer gesunden Person (Vergleichsprobe).'},
gewebe_t:{n:'Gewebeprobe Tumor',ic:'dish',c:'#9b3b3b',d:'Gewebe aus dem Tumor der Patientin / des Patienten.'},
kit:{n:'RNA-Isolierungs-Kit',ic:'box',c:'#2563eb',d:'Schließt die Zellen auf und trennt die mRNA von DNA und Proteinen.'},
rnase:{n:'RNase',ic:'bottle',c:'#7c3aed',d:'Enzym, das RNA abbaut.',why:'RNase baut RNA ab – damit würdest du deine mRNA zerstören!'},
rt:{n:'Reverse Transkriptase',ic:'tube',c:'#f97316',d:'Enzym (aus Retroviren), das zu einer RNA die komplementäre DNA (cDNA) bildet.'},
dntp:{n:'Nucleotide (dNTPs)',ic:'tube',c:'#0ea5e9',d:'Bausteine A, T, G, C für neue DNA-Stränge.'},
primer:{n:'Primer',ic:'tube',c:'#64748b',d:'Kurze Startstücke, an denen Polymerasen mit der Synthese beginnen.'},
taq:{n:'Taq-Polymerase',ic:'tube',c:'#facc15',d:'Hitzestabile DNA-Polymerase für die PCR.'},
gruen:{n:'Fluoreszenz­farbstoff grün',ic:'bottle',c:'#16a34a',d:'Leuchtet grün, wenn er mit Laserlicht angeregt wird.'},
rot:{n:'Fluoreszenz­farbstoff rot',ic:'bottle',c:'#dc2626',d:'Leuchtet rot, wenn er mit Laserlicht angeregt wird.'},
chip:{n:'DNA-Chip mit Gen-Sonden',ic:'chip',c:'#334155',d:'Glasträger mit Tausenden Spots; jeder Spot enthält Kopien einer Gen-Sonde (Oligonucleotid).'},
hyb:{n:'Hybridisierungs­puffer',ic:'bottle',c:'#14b8a6',d:'Salzlösung, in der sich komplementäre Stränge gut zusammenlagern.'},
wasch:{n:'Waschpuffer',ic:'bottle',c:'#93c5fd',d:'Spült alle cDNA-Moleküle weg, die nicht fest gebunden haben.'},
scanner:{n:'Laserscanner',ic:'device',c:'#1e293b',d:'Regt die Farbstoffe mit Laserlicht an und misst die Fluoreszenz jedes Spots.'},
restr:{n:'Restriktions­enzym EcoRI',ic:'tube',c:'#a855f7',d:'Schneidet DNA an der Erkennungsstelle GAATTC.',why:'Ein Restriktionsenzym schneidet DNA – das brauchst du für den DNA-Chip nicht.'},
ligase:{n:'DNA-Ligase',ic:'tube',c:'#ec4899',d:'Verknüpft DNA-Stücke miteinander.',why:'Die Ligase verknüpft DNA-Stücke (z. B. beim Klonieren) – hier wird nichts verknüpft.'},
gel:{n:'Agarosegel',ic:'gel',c:'#cbd5e1',d:'Trennt DNA-Stücke nach ihrer Länge (Gelelektrophorese).',why:'Mit dem Gel trennst du DNA nach der Länge – für den DNA-Chip ist das nicht nötig.'},
antik:{n:'Antikörper',ic:'bottle',c:'#f59e0b',d:'Erkennen bestimmte Proteine.',why:'Antikörper erkennen Proteine – auf dem DNA-Chip werden aber Nucleinsäuren nachgewiesen.'},
mikro:{n:'Lichtmikroskop',ic:'micro',c:'#475569',d:'Vergrößert Zellen.',why:'Die Fluoreszenz der vielen winzigen Spots wird mit dem Laserscanner gemessen, nicht mit dem Lichtmikroskop.'}
};
const ORDER=['gewebe_g','gewebe_t','kit','rnase','rt','dntp','primer','taq','restr','gruen','rot','ligase','chip','hyb','gel','wasch','antik','scanner','mikro'];
const LATER={gewebe_g:'Die Gewebeproben wurden schon verarbeitet.',gewebe_t:'Die Gewebeproben wurden schon verarbeitet.',kit:'Die mRNA ist bereits isoliert.',
rt:'Die Reverse Transkriptase wird nur einmal gebraucht: zum Umschreiben von mRNA in cDNA.',taq:'Die Taq-Polymerase gehört zur PCR – in diesem Schritt wird nichts vervielfältigt.',
gruen:'Farbstoffe kommen bei der PCR an die cDNA.',rot:'Farbstoffe kommen bei der PCR an die cDNA.',chip:'Der DNA-Chip kommt erst bei der Hybridisierung dazu.',
hyb:'Der Hybridisierungspuffer wird erst auf dem Chip gebraucht.',wasch:'Gewaschen wird erst nach der Hybridisierung.',scanner:'Gescannt wird ganz am Ende, wenn der Chip gewaschen ist.',
dntp:'Nucleotide braucht man nur, wenn neue DNA-Stränge gebaut werden.',primer:'Primer braucht man nur, wenn neue DNA-Stränge gebaut werden.'};
// Sequenzen aus dem Arbeitsblatt
const H=[['GTCGTAGC',2],['CGCCGTGT',2],['CTGATCGA',4]], T=[['GTCGTAGC',2],['CGCCGTGT',2],['GGCATAGA',4]];
const comp=s=>s.replace(/./g,c=>({A:'T',T:'A',G:'C',C:'G'})[c]);
const GENES=[{g:'Gen 1',probe:comp('GGCATAGA'),col:'#ef4444',bind:['GGCATAGA (rot, Tumor)']},
{g:'Gen 2',probe:comp('CTGATCGA'),col:'#22c55e',bind:['CTGATCGA (grün, gesund)']},
{g:'Gen 3',probe:comp('GTCGTAGC'),col:'#facc15',bind:['GTCGTAGC (grün, gesund)','GTCGTAGC (rot, Tumor)']},
{g:'Gen 4',probe:'AAGGGTAC',col:'#0b0f17',bind:[]}];
const MEAN=['nur im Tumorgewebe aktiv','nur im gesunden Gewebe aktiv','in beiden Geweben aktiv','in keinem der Gewebe aktiv'];
// ---------- Grafik-Helfer ----------
function icon(t,c){const s='<svg viewBox="0 0 48 48" aria-hidden="true">';
 if(t==='tube')return s+`<path d="M18 6h12v4h-2v24a4 4 0 0 1-8 0V10h-2z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><path d="M20 22h8v12a4 4 0 0 1-8 0z" fill="${c}"/><rect x="16" y="3" width="16" height="5" rx="2" fill="${c}"/></svg>`;
 if(t==='bottle')return s+`<rect x="19" y="4" width="10" height="7" rx="2" fill="#334155"/><path d="M15 14c0-3 4-3 4-3h10s4 0 4 3v26a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><rect x="16" y="22" width="16" height="19" rx="2" fill="${c}"/></svg>`;
 if(t==='box')return s+`<rect x="7" y="13" width="34" height="27" rx="3" fill="${c}"/><path d="M7 13l6-7h22l6 7z" fill="#93c5fd"/><rect x="14" y="21" width="20" height="9" rx="2" fill="#fff"/><text x="24" y="28" font-size="7" text-anchor="middle" font-weight="700" fill="${c}">RNA</text></svg>`;
 if(t==='dish')return s+`<ellipse cx="24" cy="30" rx="19" ry="9" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><ellipse cx="24" cy="27" rx="12" ry="6" fill="${c}"/><circle cx="20" cy="26" r="2" fill="#fff8"/><circle cx="27" cy="28" r="2" fill="#fff8"/></svg>`;
 if(t==='chip')return s+`<rect x="5" y="12" width="38" height="24" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><rect x="11" y="16" width="26" height="16" rx="2" fill="${c}"/>`+[0,1,2,3].map(i=>[0,1].map(j=>`<circle cx="${15+i*6}" cy="${20.5+j*7}" r="2" fill="${['#ef4444','#22c55e','#facc15','#475569'][(i+j)%4]}"/>`).join('')).join('')+'</svg>';
 if(t==='device')return s+`<rect x="5" y="14" width="38" height="24" rx="4" fill="${c}"/><rect x="10" y="19" width="20" height="9" rx="2" fill="#0ea5e9"/><circle cx="36" cy="24" r="3" fill="#ef4444"/><rect x="10" y="31" width="28" height="3" fill="#475569"/></svg>`;
 if(t==='gel')return s+`<rect x="6" y="12" width="36" height="26" rx="3" fill="#e0f2fe" stroke="#475569" stroke-width="2"/>`+[0,1,2,3].map(i=>`<rect x="${10+i*8}" y="${16+(i%2)*6}" width="6" height="2.5" fill="#6366f1"/><rect x="${10+i*8}" y="${26+(i%3)*2}" width="6" height="2.5" fill="#6366f1"/>`).join('')+'</svg>';
 if(t==='micro')return s+`<path d="M28 6l6 4-10 16-6-4z" fill="${c}"/><rect x="12" y="38" width="28" height="5" rx="2" fill="${c}"/><path d="M34 18c6 6 6 14 0 20" stroke="${c}" stroke-width="4" fill="none"/><rect x="14" y="30" width="16" height="3" fill="#94a3b8"/></svg>`;
}
const wave=(x,y,w,col,sw=3)=>{let d=`M${x} ${y}`;for(let i=0;i<w;i+=8)d+=` q4 -5 8 0`;return`<path d="${d}" stroke="${col}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`};
function strands(list,col,shape){return list.map(([s,n])=>Array.from({length:n},()=>`<div class="seq" style="display:flex;align-items:center;gap:6px">5′-${s}-3′ ${shape==='c'?`<span style="width:13px;height:13px;border-radius:50%;background:${col};display:inline-block"></span>`:`<span style="width:13px;height:13px;background:${col};display:inline-block"></span>`}</div>`).join('')).join('')}
function chipSVG(state){ // state: 'empty','hyb','wash','scan'
 const cols=['#ef4444','#22c55e','#facc15','#0b0f17'];let spots='';
 for(let i=0;i<8;i++)for(let j=0;j<6;j++){const k=(i*7+j*3)%9;const lit=state==='scan'?['#ef4444','#22c55e','#facc15','#0b0f17','#facc15','#22c55e','#ef4444','#0b0f17','#22c55e'][k]:(state==='empty'?'#cbd5e1':'#64748b');
  spots+=`<circle cx="${36+i*30}" cy="${40+j*30}" r="9" fill="${lit}" ${state==='scan'&&lit!=='#0b0f17'?`style="filter:drop-shadow(0 0 4px ${lit})"`:''}/>`}
 const big=GENES.map((g,k)=>{const x=302+(k%2)*68,y=58+Math.floor(k/2)*72,c=state==='scan'?g.col:(state==='empty'?'#e2e8f0':'#64748b');
  return`<circle cx="${x}" cy="${y}" r="30" fill="${c}" stroke="#e2e8f0" stroke-width="2" ${state==='scan'&&k<3?`style="filter:drop-shadow(0 0 10px ${g.col})"`:''}/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${state==='scan'&&k===2?'#111':'#fff'}">${g.g}</text>`}).join('');
 let mov='';if(state==='hyb'){for(let k=0;k<22;k++){const c=k%2?'#22c55e':'#ef4444';mov+=`<circle r="4" fill="${c}"><animate attributeName="cx" values="${20+(k*37)%250};${302+(k%2)*68}" dur="${2.5+(k%5)*.4}s" fill="freeze"/><animate attributeName="cy" values="${215};${58+((k>>1)%2)*72}" dur="${2.5+(k%5)*.4}s" fill="freeze"/></circle>`}}
 return`<svg viewBox="0 0 410 232" role="img" aria-label="DNA-Chip"><rect x="10" y="15" width="260" height="200" rx="10" fill="#0f172a"/>${spots}<rect x="266" y="15" width="138" height="160" rx="10" fill="#0b1220" stroke="#e2e8f0"/>${big}<path d="M262 200 L285 170" stroke="#e2e8f0" stroke-width="2"/><rect x="232" y="188" width="36" height="22" fill="none" stroke="#e2e8f0" stroke-width="2"/>${mov}${state==='scan'?'<rect class="scan" x="10" y="12" width="394" height="4" fill="#38bdf8" opacity=".8"/>':''}<text x="12" y="228" font-size="12" fill="currentColor">Ausschnitt: 4 Spots mit Gen-Sonden (vergrößert rechts)</text></svg>`}
function pair(cdna,probe,col){const bars=cdna.split('').map((c,i)=>comp(c)===probe[i]?'|':' ').join('');
 return`<div class="seq" style="line-height:1.25;white-space:pre"><span style="color:${col}">5′-${cdna}-3′</span>\n    ${bars}\n3′-${probe}-5′ <small>(Sonde)</small></div>`}
function bild1(){return`<svg viewBox="0 0 640 250" role="img" aria-label="Bild 1 farbig: Herstellung markierter cDNA">
 <text x="10" y="22" font-size="15" font-weight="700" fill="currentColor">gesundes Gewebe</text><text x="10" y="148" font-size="15" font-weight="700" fill="currentColor">Tumorgewebe</text>
 <ellipse cx="60" cy="70" rx="44" ry="24" fill="#f4a6a6"/><ellipse cx="60" cy="195" rx="44" ry="24" fill="#9b3b3b"/>
 ${[70,195].map(y=>`<path d="M110 ${y}h30" stroke="currentColor" stroke-width="2" marker-end="url(#a)"/><circle cx="125" cy="${y-22}" r="11" fill="#1f7ae0"/><text x="125" y="${y-18}" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">1</text>`).join('')}
 ${[48,62,76,90].map(y=>wave(150,y,70,'#8b5cf6')).join('')}${[173,187,201,215].map(y=>wave(150,y,70,'#8b5cf6')).join('')}
 ${[70,195].map(y=>`<path d="M232 ${y}h30" stroke="currentColor" stroke-width="2" marker-end="url(#a)"/><circle cx="247" cy="${y-22}" r="11" fill="#1f7ae0"/><text x="247" y="${y-18}" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">2</text>`).join('')}
 ${[48,66,84].map(y=>wave(272,y,70,'#8b5cf6')+wave(272,y+5,70,'#0f766e')).join('')}${[173,191,209].map(y=>wave(272,y,70,'#8b5cf6')+wave(272,y+5,70,'#0f766e')).join('')}

add({k:'info',t:'Start',h:`<div class="two"><div><span class="kind">Einführung</span><h2>Welche Gene sind im Tumor aktiv?</h2>
<p>Alle Körperzellen enthalten dieselben Gene. Doch nicht jedes Gen ist in jeder Zelle aktiv. Ein aktives Gen wird abgelesen – dabei entsteht <b>mRNA</b>. Bei Tumorzellen sind oft andere Gene aktiv als in gesunden Zellen.</p>
<p>Mit einem <b>DNA-Chip</b> (DNA-Microarray) kann man für Tausende Gene gleichzeitig vergleichen, ob sie im Tumor oder im gesunden Gewebe abgelesen werden.</p>
<div class="note">So funktioniert dieses Labor: Lies die Infoseiten. An den <b>Laborstationen</b> nimmst du die passenden Stoffe und Geräte aus dem Regal, legst sie auf die Arbeitsfläche und startest die Reaktion. Zum Schluss wertest du den Chip aus und übst an weiteren Beispielen.</div></div>
<div class="fig card">${chipSVG('scan')}</div></div>`});

add({k:'info',t:'Info: mRNA',h:`<div class="two"><div><span class="kind">Info 1</span><h2>Schritt 1: Die mRNA gewinnen</h2>
<p>Aus dem Gewebe der Patientin oder des Patienten und zum Vergleich aus Gewebe einer gesunden Person wird die <b>mRNA</b> extrahiert.</p>
<p>Die Menge einer bestimmten mRNA zeigt, wie stark das zugehörige Gen gerade abgelesen (<b>exprimiert</b>) wird.</p>
<div class="note">Dazu werden die Zellen aufgebrochen und die mRNA von DNA und Proteinen getrennt. RNA ist empfindlich – Enzyme, die RNA abbauen (RNasen), müssen ferngehalten werden.</div></div>
<div class="card fig">${bild1()}<p style="font-size:14px;margin-top:6px">Schritt ① bis ③ – farbige Fassung von Bild 1 des Arbeitsblatts</p></div></div>`});
add({k:'lab',t:'Station 1',st:{title:'Station 1: mRNA isolieren',task:'Nimm aus dem Regal alles, was du brauchst, um aus beiden Gewebeproben die mRNA zu gewinnen.',need:['gewebe_g','gewebe_t','kit'],carry:[],run:'Zellen werden aufgeschlossen, mRNA wird isoliert …',

add({k:'info',t:'Info: cDNA',h:`<div class="two"><div><span class="kind">Info 2</span><h2>Schritt 2: Aus mRNA wird cDNA</h2>
<p>Mit dem Enzym <b>reverse Transkriptase</b> wird zu jeder mRNA eine <b>komplementäre DNA (cDNA)</b> gebildet. Dazu braucht das Enzym Nucleotide und einen Primer als Startstück.</p>
<p>Warum der Umweg? DNA ist viel stabiler als RNA, und nur DNA kann mit der PCR vervielfältigt werden.</p>
<div class="note">Reverse Transkriptase stammt ursprünglich aus Retroviren (z. B. HIV): Diese Viren schreiben ihre RNA in DNA um.</div></div>

add({k:'info',t:'Info: Markierung',h:`<div class="two"><div><span class="kind">Info 3</span><h2>Schritt 3: Vervielfältigen und einfärben</h2>
<p>Die cDNA wird mit der <b>PCR</b> vervielfältigt. Dabei werden Nucleotide mit einem <b>Fluoreszenzfarbstoff</b> eingebaut:</p>
<p><span class="g">● grün</span> für die cDNA aus <b>gesundem Gewebe</b>, <span class="r">■ rot</span> für die cDNA aus dem <b>Tumorgewebe</b>.</p>
<div class="note">Für die PCR brauchst du eine hitzestabile DNA-Polymerase (Taq-Polymerase), Nucleotide und Primer – und hier zusätzlich die beiden Farbstoffe.</div></div>
<div class="card"><h3 style="margin-top:0">So sehen die Proben danach aus</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><b class="g">gesund</b>${strands(H,'#16a34a','c')}</div><div><b class="r">Tumor</b>${strands(T,'#dc2626','s')}</div></div></div></div>`});
add({k:'lab',t:'Station 3',st:{title:'Station 3: PCR und Fluoreszenzmarkierung',task:'Vervielfältige die cDNA beider Proben und markiere sie mit Farbstoffen.',need:['taq','dntp','primer','gruen','rot'],carry:['cDNA gesund','cDNA Tumor'],run:'PCR läuft: 30 Zyklen Erhitzen – Abkühlen – Verlängern …',assign:true,
 res:`<p><b>Ergebnis:</b> Viele Kopien einzelsträngiger, farbig markierter cDNA.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><b class="g">gesund</b>${strands(H,'#16a34a','c')}</div><div><b class="r">Tumor</b>${strands(T,'#dc2626','s')}</div></div>`}});
add({k:'info',t:'Info: Chip',h:`<div class="two"><div><span class="kind">Info 4</span><h2>Schritt 4: Der DNA-Chip</h2>
<p>Ein DNA-Chip ist ein Glasträger mit Tausenden winziger Vertiefungen (Spots). In jedem Spot sitzen viele Kopien einer kurzen <b>Gen-Sonde</b> – eines Oligonucleotids, das genau einem Gen zugeordnet ist.</p>
<p>Beide markierten cDNA-Proben kommen <b>gemeinsam</b> auf den Chip. Ist eine cDNA zu einer Sonde komplementär, lagert sie sich an: <b>Hybridisierung</b>.</p>
<h3>Die vier Sonden in unserem Ausschnitt</h3>${GENES.map(g=>`<div class="seq">${g.g}: 3′-${g.probe}-5′</div>`).join('')}</div>
<div class="card fig">${chipSVG('empty')}<p style="font-size:14px">Farbige Fassung von Bild 2: Gen-Sonden auf dem DNA-Chip</p></div></div>`});
add({k:'lab',t:'Station 4',st:{title:'Station 4: Hybridisierung',task:'Bringe die beiden markierten cDNA-Proben gemeinsam auf den Chip, damit sie an passende Sonden binden können.',need:['chip','hyb'],carry:['cDNA grün markiert','cDNA rot markiert'],run:'Inkubation über Nacht bei 42 °C (im Zeitraffer) …',dur:6000,anim:'hyb',

add({k:'info',t:'Info: Waschen',h:`<div class="two"><div><span class="kind">Info 5</span><h2>Schritt 5: Waschen und Scannen</h2>
<p>Nicht gebundene cDNA-Moleküle werden <b>abgewaschen</b>. Sonst würde der ganze Chip leuchten.</p>
<p>Danach tastet ein <b>Laserscanner</b> den Chip ab. Die Farbstoffe leuchten auf – das Ergebnis wird als farbig fluoreszierende Punkte sichtbar.</p>
<div class="note"><b>Farben lesen:</b> rotes und grünes Licht ergeben zusammen <span class="y">gelbes</span> Licht. Kein Licht ergibt ein schwarzes Feld.</div></div>
<div class="card"><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">${[['#ef4444','nur rot'],['#22c55e','nur grün'],['#facc15','rot + grün'],['#0b0f17','keine cDNA']].map(([c,t])=>`<div style="text-align:center"><div class="dot" style="background:${c};color:${c};margin:auto"></div><small>${t}</small></div>`).join('')}</div></div></div>`});

add({k:'info',t:'Bedeutung',h:`<div class="two"><div><span class="kind">Info 6</span><h2>Was bringt das der Medizin?</h2>
<p>Ein echter DNA-Chip prüft nicht vier, sondern Tausende Gene gleichzeitig. So entsteht ein <b>Expressionsprofil</b> – eine Art Fingerabdruck der Genaktivität.</p>
<p>Gene, die nur im Tumor aktiv sind (rot), können Hinweise auf <b>tumorauslösende Gene</b> geben. Expressionsprofile helfen, Tumorarten zu unterscheiden und eine passende Therapie auszuwählen.</p>
<div class="note">In den folgenden Beispielen wendest du dein Wissen an. Die Proben sind schon vorbereitet – du startest direkt den Laserscan. <b>Achtung:</b> Rot und Grün stehen dort nicht immer für Tumor und gesundes Gewebe. Lies bei jedem Beispiel, welche Probe welche Farbe bekommen hat.</div></div>
<div class="card"><table><tr><th>Farbe</th><th>Bedeutung im Tumor-Versuch</th></tr><tr><td><span class="r">rot</span></td><td>Gen nur im Tumor exprimiert</td></tr><tr><td><span class="g">grün</span></td><td>Gen nur im gesunden Gewebe exprimiert</td></tr><tr><td><span class="y">gelb</span></td><td>in beiden exprimiert</td></tr><tr><td><b>schwarz</b></td><td>in keinem exprimiert</td></tr></table></div></div>`});

const miniChip=(m,genes)=>`<div style="display:grid;grid-template-columns:repeat(${genes.length},minmax(0,1fr));gap:6px;background:#0f172a;padding:10px;border-radius:10px">${m.map((c,i)=>`<div style="text-align:center;color:#fff;font-size:12px;font-weight:700"><div class="dot" style="margin:auto;width:100%;max-width:46px;height:auto;aspect-ratio:1;background:${CC[c]};color:${CC[c]}"></div>${genes[i]}</div>`).join('')}</div>`;
const u1ok={};
add({k:'ex',t:'Übung 1',h:`<span class="kind ex">Übung 1 · vom Befund zum Leuchtmuster</span><h2>Welches Leuchtmuster gehört zu welchen Beschwerden?</h2>
<div class="two"><div><p>Von vier Patienten wird aus der Dünndarmschleimhaut mRNA gewonnen und auf einem DNA-Chip untersucht. Drei von ihnen haben nach dem Essen Verdauungsbeschwerden, Frau Orange hat keine. Die Gene:</p>
<ul><li><b>LCT</b> – Laktase: spaltet Milchzucker (Laktose)</li><li><b>SI</b> – Saccharase-Isomaltase: spaltet Haushaltszucker (Saccharose)</li><li><b>ACTB</b> – Aktin-Gen, in fast allen Zellen aktiv (Kontrolle)</li><li><b>INS</b> – Insulin-Gen, wird nur in der Bauchspeicheldrüse abgelesen</li></ul>
<p>Fehlt ein Verdauungsenzym, gelangt der Zucker unverdaut in den Dickdarm. Dort vergären ihn Bakterien – das führt zu Blähungen, Bauchschmerzen und Durchfall.</p>
<div class="card" style="margin-top:10px"><b>So liest du die Farben in dieser Übung</b><table style="margin-top:6px"><tr><td><span class="y">gelb</span></td><td style="text-align:left">Gen wird beim Patienten <b>und</b> bei der Vergleichsperson abgelesen</td></tr><tr><td><span class="g">grün</span></td><td style="text-align:left">Gen wird <b>nur bei der Vergleichsperson</b> abgelesen – es <b>fehlt beim Patienten</b></td></tr><tr><td><span class="r">rot</span></td><td style="text-align:left">Gen wird nur beim Patienten abgelesen</td></tr><tr><td><b>schwarz</b></td><td style="text-align:left">Gen wird bei keiner der beiden abgelesen</td></tr></table></div></div>
<div class="card"><h3 style="margin-top:0">Die vier Leuchtmuster</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${Object.entries(U1M).map(([k,m])=>`<div><b>Muster ${k}</b>${miniChip(m,U1G)}</div>`).join('')}</div></div></div>
<h3>Ordne jedem Patienten sein Leuchtmuster zu</h3><div id="u1"></div>`,
 init(){const box=document.getElementById('u1');box.innerHTML=U1P.map((p,i)=>`<div class="spotq" style="grid-template-columns:minmax(0,1fr)"><div><b>${p.n}:</b> ${p.t}<div class="choice" data-i="${i}">${Object.keys(U1M).map(k=>`<button class="${u1ok[i]&&k===p.a?'right':''}">Muster ${k}</button>`).join('')}</div><div class="msg"></div></div></div>`).join('');
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;const w=b.parentElement,i=+w.dataset.i,k=b.textContent.slice(-1),p=U1P[i];w.querySelectorAll('button').forEach(z=>z.className='');const m=w.nextElementSibling;
   if(k===p.a){b.className='right';u1ok[i]=1;m.innerHTML='✔ '+['LCT leuchtet grün: Laktase wird nur bei der Vergleichsperson gebildet, nicht bei Herrn Pampelmuse. SI ist gelb – beide bilden Saccharase.','Alle Verdauungsgene gelb: Frau Orange und die Vergleichsperson bilden Laktase und Saccharase. INS ist schwarz, weil Darmzellen kein Insulin bilden.','SI leuchtet grün: Saccharase-Isomaltase fehlt bei Herrn Tomate. LCT ist gelb – Laktase ist vorhanden.','LCT und SI leuchten grün: Beide Enzyme fehlen bei Frau Gurke.'][i]}
   else{b.className='wrong';m.textContent='✘ Überlege: Welches Enzym fehlt bei diesem Patienten? Dann wird das Gen nur in der grün markierten Probe abgelesen.'}
   if(Object.keys(u1ok).length===4)unlock()}},need:()=>Object.keys(u1ok).length===4});

const U2S=[{p:comp('CCATGGTA'),a:'r'},{p:'GATCCTAG',a:'k'},{p:comp('TTAGCCGA'),a:'y'},{p:comp('AGCTTGCA'),a:'g'},{p:comp('ACGTTACG'),a:'k'},{p:comp('GCAATCGT'),a:'r'}];

add({k:'ex',t:'Übung 2',h:`<span class="kind ex">Übung 2 · von der Sequenz zum Leuchtmuster</span><h2>Wie wird jeder Spot leuchten?</h2>
<div class="two"><div><p>Auf den Chip werden diese markierten cDNA-Moleküle gegeben (Basensequenz jeweils 5′→3′):</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" class="card"><div><b class="g">grün markierte cDNA</b>${strands(U2G,'#16a34a','c')}</div><div><b class="r">rot markierte cDNA</b>${strands(U2R,'#dc2626','s')}</div></div>
<div class="note">Eine cDNA bindet nur an eine Sonde, deren Basen <b>komplementär</b> sind (A–T, G–C). Die Sonden sind von 3′ nach 5′ notiert – du kannst die Basen also direkt untereinander vergleichen. Danach wird gewaschen: Alles, was nicht gebunden hat, ist weg.</div></div>
<div class="card"><h3 style="margin-top:0">Sage für jeden Spot die Farbe voraus</h3><div id="u2"></div><button class="btn" id="u2scan" disabled>Laserscan: Vorhersage prüfen</button><div id="u2res"></div></div></div>`,
 init(){const box=document.getElementById('u2'),bt=document.getElementById('u2scan');
  box.innerHTML=U2S.map((x,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>Spot ${i+1}</b> <span class="seq">Sonde 3′-${x.p}-5′</span><div class="choice" data-i="${i}">${Object.entries(CN).map(([c,n])=>`<button data-c="${c}" class="${u2[i]===c?'right':''}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${CC[c]};vertical-align:-1px;border:1px solid #64748b"></span> ${n}</button>`).join('')}</div><div class="msg" style="font-size:15px"></div></div>`).join('');
  const ready=()=>{bt.disabled=Object.keys(u2).length<U2S.length};ready();
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;const w=b.parentElement,i=+w.dataset.i;w.querySelectorAll('button').forEach(z=>z.className='');b.className='sel1';b.style.borderColor='var(--acc)';u2[i]=b.dataset.c;w.nextElementSibling.textContent='';ready()};
  bt.onclick=()=>{let ok=0;U2S.forEach((x,i)=>{const w=box.querySelector(`[data-i="${i}"]`),m=w.nextElementSibling,right=u2[i]===x.a;w.querySelectorAll('button').forEach(z=>{z.style.borderColor='';z.className=z.dataset.c===u2[i]?(right?'right':'wrong'):''});
    const bind=[...U2G.map(s=>[s[0],'g']),...U2R.map(s=>[s[0],'r'])].filter(([s])=>comp(s)===x.p);
    m.innerHTML=right?`✔ ${CN[x.a]}: ${bind.length?'bindet '+[...new Set(bind.map(b=>b[1]))].map(c=>c==='g'?'grün':'rot').join(' und ')+' markierte cDNA':(x.p==='GATCCTAG'?'Die Sonde hat dieselbe Basenfolge wie eine grüne cDNA – gleich ist aber nicht komplementär, also bindet nichts.':'Zu dieser Sonde passt keine der cDNAs – nichts bindet, alles wird abgewaschen.')}`:`✘ Vergleiche Base für Base: Welche cDNA ist zu 3′-${x.p}-5′ komplementär?${x.a==='k'&&x.p==='GATCCTAG'?' (Tipp: Gleiche Basenfolge heißt nicht komplementär!)':''}`;if(right)ok++});
   document.getElementById('u2res').innerHTML=`<div class="fig" style="margin-top:12px">${miniChip(U2S.map(x=>x.a),U2S.map((x,i)=>'Spot '+(i+1)))}</div><div class="fb ${ok===U2S.length?'ok':'bad'}">${ok} von ${U2S.length} Spots richtig vorhergesagt.${ok===U2S.length?' Super!':' Korrigiere die falschen Spots und prüfe erneut.'}</div>`;
   if(ok===U2S.length){u2.done=1;unlock()}}},need:()=>!!u2.done});
// ---- Übung 3: mRNA -> cDNA -> Sonde -> Farbe ----
const rc=m=>m.replace(/./g,c=>({A:'T',U:'A',G:'C',C:'G'})[c]); // cDNA 3'->5' unter die mRNA geschrieben
const U3M=[{id:'a1',s:'g',m:'AUGGCUAC'},{id:'a2',s:'g',m:'CCGAUUGA'},{id:'a3',s:'g',m:'GGUACAUC'},{id:'b1',s:'r',m:'CCGAUUGA'},{id:'b2',s:'r',m:'UUCGGACU'},{id:'b3',s:'r',m:'AGCAUGGU'}];
const U3S=[{p:'TTCGGACT',a:'r'},{p:'ATGGCTAC',a:'g'},{p:'CACGTTAG',a:'k'},{p:'CCGATTGA',a:'y'},{p:'GGTACATC',a:'g'}];

add({k:'ex',t:'Übung 3',h:`<span class="kind ex">Übung 3 · Schritt für Schritt</span><h2>Von der mRNA zum leuchtenden Spot</h2>
<p>Aus zwei Gewebeproben wurde mRNA isoliert. <span class="g">Probe 1</span> stammt aus gesundem Gewebe und wird grün markiert, <span class="r">Probe 2</span> stammt aus Tumorgewebe und wird rot markiert. Bearbeite die drei Schritte nacheinander.</p>
<div id="u3"></div>`,
 init(){draw3()},need:()=>!!u3.done});
function tok(x){return`<span class="seq" style="display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:2px solid ${x.s==='g'?'#16a34a':'#dc2626'};border-radius:8px;padding:4px 8px;font-size:14px">3′-${rc(x.m)}-5′ ${x.s==='g'?'<span style="width:11px;height:11px;border-radius:50%;background:#16a34a;display:inline-block"></span>':'<span style="width:11px;height:11px;background:#dc2626;display:inline-block"></span>'}</span>`}
function draw3(){const box=document.getElementById('u3');if(!box)return;
 const s1=`<div class="card"><h3 style="margin-top:0">Schritt 1: Bilde zu jeder mRNA die cDNA</h3><p style="font-size:15px">Die reverse Transkriptase baut zu jeder Base die komplementäre DNA-Base ein: <b>A → T, U → A, G → C, C → G</b>. Schreibe die cDNA-Basen direkt unter die mRNA (die cDNA verläuft dann von 3′ nach 5′).</p>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px">${['g','r'].map(sp=>`<div><b class="${sp}">Probe ${sp==='g'?'1 – gesund':'2 – Tumor'}</b>${U3M.filter(x=>x.s===sp).map(x=>`<div style="margin:8px 0"><div class="seq">mRNA 5′-${x.m}-3′</div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="seq">cDNA 3′-</span><input data-id="${x.id}" maxlength="8" value="${u3.ok[x.id]?rc(x.m):((u3.val||{})[x.id]||'')}" ${u3.ok[x.id]?'disabled':''} style="font:500 16px 'Fira Code',monospace;width:9.5em;letter-spacing:.08em;padding:6px;border-radius:8px;border:2px solid ${u3.ok[x.id]?'var(--g)':(u3.msg[x.id]?'var(--r)':'var(--line)')};text-transform:uppercase;background:var(--card);color:var(--ink)" aria-label="cDNA zu ${x.m}"><span class="seq">-5′</span><span class="m3" data-for="${x.id}" style="font-size:14px">${u3.ok[x.id]?'✔':(u3.msg[x.id]||'')}</span></div></div>`).join('')}</div>`).join('')}</div>
 <button class="btn" id="u3c1">cDNA prüfen</button></div>`;
 const free=U3M.filter(x=>!(x.id in u3.place));
 const s2=u3.step<2?'':`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Schritt 2: Ziehe jede markierte cDNA auf die passende Sonde</h3><p style="font-size:15px">Die Sonden sind von 5′ nach 3′ notiert. Eine cDNA bindet nur, wenn alle Basen komplementär sind. Passt keine Sonde, ziehe die cDNA in den Abfluss – sie wird abgewaschen. <i>Auf dem Tablet: erst die cDNA antippen, dann das Ziel.</i></p>
 <div id="pool" style="display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:2px dashed var(--line);border-radius:10px">${free.map(x=>`<span class="tk" draggable="true" data-id="${x.id}" style="cursor:grab;${u3.pick===x.id?'outline:3px solid #f59e0b;border-radius:8px':''}">${tok(x)}</span>`).join('')||'<span style="color:var(--mut)">Alle cDNAs verteilt.</span>'}</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px">${U3S.map((sp,i)=>`<div class="drop" data-s="${i}" style="background:#0f172a;color:#fff;border-radius:12px;padding:10px;min-height:120px"><b>Spot ${i+1}</b><div class="seq" style="font-size:13px;color:#cbd5e1">Sonde 5′-${sp.p}-3′</div><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">${U3M.filter(x=>u3.place[x.id]===i).map(tok).join('')}</div></div>`).join('')}
 <div class="drop" data-s="w" style="background:light-dark(#e0f2fe,#0c2a3f);border-radius:12px;padding:10px;min-height:120px;border:2px dashed #38bdf8"><b>🚿 Abfluss</b><div style="font-size:13px">keine passende Sonde – wird abgewaschen</div><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">${U3M.filter(x=>u3.place[x.id]==='w').map(tok).join('')}</div></div></div><div id="u3m2" style="margin-top:8px">${u3.m2}</div></div>`;
 const s3=u3.step<3?'':`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Schritt 3: Wie leuchtet der Chip an diesen Stellen?</h3>${U3S.map((sp,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>Spot ${i+1}</b><div class="choice" data-i="${i}">${Object.entries(CN).map(([c,n])=>`<button data-c="${c}" class="${u3.col[i]===c?(u3.checked?(c===sp.a?'right':'wrong'):''):''}" style="${u3.col[i]===c&&!u3.checked?'border-color:var(--acc)':''}"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${CC[c]};vertical-align:-1px;border:1px solid #64748b"></span> ${n}</button>`).join('')}</div></div>`).join('')}
 <button class="btn" id="u3c3" ${Object.keys(u3.col).length<U3S.length?'disabled':''}>Laserscan starten</button><div id="u3m3"></div></div>`;
 box.innerHTML=s1+s2+s3;
 // Schritt 1
 document.getElementById('u3c1').onclick=()=>{let all=true;box.querySelectorAll('input[data-id]').forEach(inp=>{const x=U3M.find(z=>z.id===inp.dataset.id);if(u3.ok[x.id])return;const v=inp.value.toUpperCase().replace(/[^ACGTU]/g,'');u3.val=u3.val||{};u3.val[x.id]=inp.value;
   if(v===rc(x.m)){u3.ok[x.id]=1;delete u3.msg[x.id]}else{all=false;u3.msg[x.id]=v.includes('U')?'✘ In DNA gibt es kein U – statt U steht T.':v===rc(x.m).split('').reverse().join('')?'✘ Richtung beachten: Schreibe die Basen genau unter die mRNA-Basen.':'✘ Prüfe Base für Base: A→T, U→A, G→C, C→G.'}});
  if(Object.keys(u3.ok).length===U3M.length&&u3.step<2)u3.step=2;draw3()};
 // Schritt 2
 if(u3.step>=2){const msg=document.getElementById('u3m2');
  const put=(id,t)=>{const x=U3M.find(z=>z.id===id);
   if(t==='w'){if(U3S.some(sp=>match(x.m,sp.p))){u3.m2='<div class="fb bad">✘ Diese cDNA hat eine passende Sonde auf dem Chip – sie wird nicht abgewaschen. Suche den Spot!</div>';u3.pick=null;draw3();return}}
   else if(!match(x.m,U3S[+t].p)){u3.m2=`<div class="fb bad">✘ Die cDNA 3′-${rc(x.m)}-5′ ist nicht komplementär zur Sonde von Spot ${+t+1}. Vergleiche Base für Base.</div>`;u3.pick=null;draw3();return}
   u3.place[id]=t==='w'?'w':+t;u3.pick=null;
   if(Object.keys(u3.place).length===U3M.length&&u3.step<3){u3.step=3}
   u3.m2=t==='w'?'<div class="fb ok">✔ Richtig – diese cDNA findet keinen Partner und wird abgewaschen.</div>':'<div class="fb ok">✔ Passt! Die cDNA hybridisiert mit der Sonde.</div>';draw3()};
  box.querySelectorAll('.tk').forEach(t=>{t.ondragstart=e=>e.dataTransfer.setData('text/plain',t.dataset.id);t.onclick=()=>{u3.pick=u3.pick===t.dataset.id?null:t.dataset.id;draw3()}});
  box.querySelectorAll('.drop').forEach(d=>{d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();put(e.dataTransfer.getData('text/plain'),d.dataset.s)};d.onclick=e=>{if(u3.pick&&!e.target.closest('.tk'))put(u3.pick,d.dataset.s)}})}
 // Schritt 3
 if(u3.step>=3){box.querySelectorAll('.choice[data-i]').forEach(w=>w.onclick=e=>{const b=e.target.closest('button');if(!b)return;u3.col[+w.dataset.i]=b.dataset.c;u3.checked=0;draw3()});
  document.getElementById('u3c3').onclick=()=>{u3.checked=1;const ok=U3S.filter((sp,i)=>u3.col[i]===sp.a).length;draw3();
   document.getElementById('u3m3').innerHTML=`<div style="margin-top:12px">${miniChip(U3S.map(sp=>sp.a),U3S.map((sp,i)=>'Spot '+(i+1)))}</div><div class="fb ${ok===U3S.length?'ok':'bad'}">${ok===U3S.length?'✔ Alle Spots richtig! Spot 4 leuchtet gelb, weil die mRNA CCGAUUGA in beiden Proben vorkommt. Die Tumor-mRNA AGCAUGGU hatte keine Sonde und wurde abgewaschen; Spot 3 bleibt schwarz.':ok+' von '+U3S.length+' richtig. Schau, welche Farben die cDNAs auf dem jeweiligen Spot haben, und korrigiere.'}</div>`;
   if(ok===U3S.length){u3.done=1;unlock()}}}}

add({k:'ab',t:'Aufgaben AB',h:`<span class="kind ab">Arbeitsblatt</span><h2>DNA-Microarrays in der Tumordiagnostik</h2>
<div class="two"><div><p>DNA-Microarrays werden in der medizinischen Diagnostik z. B. für den Nachweis von tumorauslösenden Genen verwendet. Dazu wird aus Geweben einer Patientin oder eines Patienten sowie zum Vergleich aus Gewebe einer gesunden Person mRNA extrahiert. Daraus wird mit reverser Transkriptase cDNA (komplementäre DNA) gebildet und mittels PCR vervielfältigt. Je nachdem, ob die Proben von gesundem Gewebe oder Tumorgewebe stammen, werden die einzelsträngigen cDNA-Moleküle dabei mit einem grün bzw. mit einem rot fluoreszierenden Farbstoff markiert [B 1]. Diese Moleküle werden gemeinsam auf einen Glasträger aufgebracht, auf dem sich in festgelegter Anordnung in kleinen Vertiefungen kurze Gen-Sonden befinden. Dies sind Tausende von Kopien bestimmter Oligonucleotide, die jeweils einem Gen zugeordnet werden können [B 2]. Nach Hybridisierung der komplementären Moleküle und Abwaschen nicht gebundener Fragmente wird das Ergebnis als farbig fluoreszierende Punkte auf dem DNA-Chip sichtbar.</p>
<ol><li>Beschreiben Sie kurz die Vorgänge ① bis ④ in Bild 1 und Bild 2 zur Untersuchung der Genexpression.</li><li>Ermitteln Sie in Bild 2 die Hybridisierungen, die mit den Nucleotidsträngen aus Bild 1 möglich sind.</li><li>Werten Sie die Fluoreszenzergebnisse aus. (Hinweis: rotes und grünes Licht ergeben zusammen gelbes Licht, kein Licht ergibt ein schwarzes Feld).</li></ol>
<details><summary>Lösungen</summary><p>1 ① Extraktion von mRNA aus gesundem Gewebe und Tumorgewebe. ② Mithilfe des Enzyms reverse Transkriptase wird cDNA komplementär zur RNA gebildet. ③ Die cDNA wird mit der PCR vervielfältigt und mit Fluoreszenzfarbstoffen markiert. ④ Die markierten cDNA-Moleküle hybridisieren an Oligonucleotide.</p><p>2 siehe Auswertung (Hybridisierungsergebnis im DNA-Microarray)</p><p>3 Gen 1 (rot) Exprimierung im Tumor; Gen 2 (grün) Exprimierung in gesundem Gewebe; Gen 3 (gelb) Exprimierung im Tumor und gesundem Gewebe; Gen 4 (schwarz) Exprimierung in keinem Gewebe</p></details></div>
<div><div class="card fig"><b>Bild 1</b> Herstellung von markierten c-DNA-Molekülen (Fluoreszenzfarbstoffe: <span class="g">● grün</span>, <span class="r">■ rot</span>)${bild1()}</div><div class="card fig" style="margin-top:12px"><b>Bild 2</b> Gen-Sonden auf DNA-Chip für die Hybridisierung mit markierten cDNA-Molekülen<div style="font-size:15px;margin:6px 0">④ grün und rot markierte cDNA → DNA-Chip</div>${chipSVG('empty')}${GENES.map(g=>`<div class="seq">${g.g}: 3′-${g.probe}-5′</div>`).join('')}</div></div></div>`});
// ---- Zusatzaufgabe Leukämie ----
const TAB=[['A1','AML','B1','ALL','C1','AML/ALL','D1','--','E1','AML'],['A2','ALL','B2','AML','C2','ALL','D2','AML','E2','AML'],['A3','ALL','B3','ALL','C3','AML','D3','AML','E3','ALL'],['A4','AML','B4','--','C4','ALL','D4','--','E4','ALL'],['A5','ALL','B5','ALL','C5','AML','D5','AML','E5','AML/ALL']];
const PX=['A2','A3','B1','B3','C1','C2','C4','E3'],PY=['A1','B2','C3','D2','D5','E1'];
const arr=(on)=>`<div class="arr"><div class="h"></div>${'ABCDE'.split('').map(c=>`<div class="h">Gen ${c}</div>`).join('')}${[1,2,3,4,5].map(r=>`<div class="h">${r}</div>${'ABCDE'.split('').map(c=>`<div class="${on.includes(c+r)?'on':''}">${c+r}</div>`).join('')}`).join('')}</div>`;
let leuk=0;
add({k:'ab',t:'Zusatz',h:`<span class="kind ab">Zusatzaufgabe vom Arbeitsblatt</span><h2>Identifizierung einer Leukämie-Erkrankung mittels DNA-Microarray</h2>
<p>Man unterscheidet zwischen Akuter Lymphatischer Leukämie (ALL) und Akuter Myeloischer Leukämie (AML). Ein DNA-Microarray mit dem Expressionsmuster von 25 Genen (A1 bis E5) aus den funktionsuntüchtigen Vorläuferzellen der Weißen Blutzellen, den sogenannten Leukämiezellen, zeigt, dass diese 25 Gene bei den bei ALL und AML unterschiedlich exprimiert werden [B 2]. Für die Diagnosestellung mit einem Microarray wird bei zwei an Leukämie erkrankten Personen aus der mRNA cDNA hergestellt, mit einem Fluoreszenzfarbstoff markiert und mit den Gensonden hybridisiert [B 3].</p>
<div style="display:grid;gap:14px"><div class="card"><b>Bild 2</b> Unterscheidung zwischen zwei Leukämieformen (ALL, AML)<div class="scroll"><table><tr>${['Gen A','Expression in','Gen B','Expression in','Gen C','Expression in','Gen D','Expression in','Gen E','Expression in'].map(x=>`<th>${x}</th>`).join('')}</tr>${TAB.map(r=>`<tr>${r.map(x=>`<td style="${x==='ALL'?'background:#dbeafe;color:#1e3a8a':x==='AML'?'background:#fce7f3;color:#831843':''}">${x}</td>`).join('')}</tr>`).join('')}</table></div></div>
<div class="card"><b>Bild 3</b> Microarrays von zwei an Leukämie erkrankten Personen (links: Person X; rechts Person Y)<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:8px"><div><b>Person X</b>${arr(PX)}</div><div><b>Person Y</b>${arr(PY)}</div></div><p style="font-size:13px;color:var(--mut);margin-top:6px">Leuchtmuster passend zur Lösung des Arbeitsblatts nachgezeichnet.</p></div></div>
<div class="note"><b>Wichtig für die Diagnose:</b> In den Leukämiezellen einer erkrankten Person werden <b>nicht immer alle</b> Transkripte gefunden, die für ihre Leukämieform typisch sind. Die Genexpression schwankt von Person zu Person und zum Beispiel mit dem Krankheitsstadium. Entscheidend ist deshalb, mit welcher Leukämieform das Leuchtmuster <b>am besten übereinstimmt</b> – nicht, ob alle zwölf typischen Gene leuchten.</div>
<ol><li>Erklären Sie die Diagnosen für die Personen X und Y mithilfe der dargestellten Ergebnisse [B 2 und 3].</li></ol>
<div class="card"><p><b>Deine Diagnose:</b></p><p>Person X:</p><div class="choice" data-p="X"><button>ALL</button><button>AML</button></div><p>Person Y:</p><div class="choice" data-p="Y"><button>ALL</button><button>AML</button></div><div id="lmsg"></div></div>
<details><summary>Lösung</summary><p>Person X ALL: Acht der zwölf bei dieser Erkrankung exprimierten Gene sind in dem Microarray zu finden. Person Y AML: Sechs der zwölf bei dieser Erkrankung exprimierten Gene sind zu finden</p></details>`,
 init(){document.querySelectorAll('[data-p]').forEach(w=>w.onclick=e=>{const b=e.target.closest('button');if(!b)return;w.querySelectorAll('button').forEach(z=>z.className='');const ok=(w.dataset.p==='X'&&b.textContent==='ALL')||(w.dataset.p==='Y'&&b.textContent==='AML');b.className=ok?'right':'wrong';w.dataset.ok=ok?1:0;
  const m=document.getElementById('lmsg');m.innerHTML=ok?`<div class="fb ok">✔ ${w.dataset.p==='X'?'Bei Person X leuchten nur Gene, die bei ALL exprimiert werden (z. B. A2, A3, B1, B3) – 8 der 12 ALL-Gene. Dass nicht alle 12 leuchten, ist normal: Nicht jedes typische Transkript wird in den Zellen jeder erkrankten Person gefunden.':'Bei Person Y leuchten nur Gene, die bei AML exprimiert werden (z. B. A1, B2, C3, D2) – 6 der 12 AML-Gene. Auch hier werden nicht alle typischen Transkripte gefunden; das Muster passt aber eindeutig zu AML.'}</div>`:'<div class="fb bad">✘ Vergleiche die leuchtenden Felder mit der Tabelle: Bei welcher Leukämieform werden diese Gene exprimiert?</div>'})}});
add({k:'info',t:'Fertig',h:`<span class="kind">Geschafft</span><h2>Du hast den DNA-Chip-Versuch durchgeführt!</h2><div class="two"><div><h3>Die Schritte im Überblick</h3><ol><li>mRNA aus gesundem Gewebe und Tumorgewebe isolieren</li><li>mit reverser Transkriptase cDNA bilden</li><li>cDNA mit PCR vervielfältigen und grün bzw. rot markieren</li><li>gemeinsam auf den DNA-Chip geben – Hybridisierung mit den Gen-Sonden</li><li>ungebundene cDNA abwaschen, mit dem Laserscanner auslesen und auswerten</li></ol></div><div class="fig card">${chipSVG('scan')}</div></div>`});
// ---------- Labor-Logik ----------
const done=new Set(),solvedEval=new Set();let cur=0,maxSeen=0,sel=new Set();
const V=document.getElementById('view'),NX=document.getElementById('next'),PV=document.getElementById('prev'),D=document.getElementById('dots');
function unlock(){done.add(cur);dots()}
function isDone(i){const p=P[i];return p.k==='lab'?done.has(i):(p.need?!!p.need():false)}
function dots(){D.innerHTML=P.map((p,i)=>`<button title="${p.t}" class="${i===cur?'cur':(isDone(i)?'done':'')}" data-i="${i}">${i+1}</button>`).join('')}
D.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)go(+b.dataset.i)};
function go(i){cur=i;maxSeen=Math.max(maxSeen,i);const p=P[i];sel=new Set();
 if(p.k==='lab')renderLab(p.st);else{V.innerHTML=p.h;p.init&&p.init()}
 NX.disabled=i===P.length-1;PV.disabled=i===0;
 NX.textContent=i===P.length-1?'Ende':'Weiter →';dots();window.scrollTo({top:0,behavior:'smooth'})}
NX.onclick=()=>go(cur+1);document.getElementById('ovb').onclick=()=>go(1);PV.onclick=()=>go(cur-1);
function renderLab(st){
 V.innerHTML=`<span class="kind lab">Laborstation</span><h2>${st.title}</h2><div class="lab" id="labgrid"><div class="shelf"><h3>Regal – tippe an, was du brauchst</h3>${[0,1,2].map(r=>`<div class="board">${ORDER.slice(r*7,r*7+7).map(id=>`<button class="item" data-id="${id}" title="${ITEMS[id].d}">${icon(ITEMS[id].ic,ITEMS[id].c)}<span>${ITEMS[id].n}</span></button>`).join('')}</div>`).join('')}</div>
 <div class="bench"><div class="task"><b>Auftrag:</b> ${st.task}</div>${st.carry.length?`<div class="carry">Aus dem vorigen Schritt: ${st.carry.map(c=>`<span>${c}</span>`).join('')}</div>`:''}<b>Arbeitsfläche</b> <small style="color:var(--mut)">(nochmal tippen = zurück ins Regal)</small><div class="onbench" id="ob"></div><div id="desc" style="font-size:14px;color:var(--mut);margin-top:6px"></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="go">Reaktion starten</button><button class="btn ghost" id="tip">Tipp</button></div><div id="fb"></div></div></div>`;
 const ob=document.getElementById('ob'),fb=document.getElementById('fb');
 const paint=()=>{ob.innerHTML=[...sel].map(id=>`<button class="item" data-id="${id}">${icon(ITEMS[id].ic,ITEMS[id].c)}<span>${ITEMS[id].n}</span></button>`).join('')||'<span style="color:var(--mut)">Noch leer.</span>';
  V.querySelectorAll('.shelf .item').forEach(b=>b.classList.toggle('sel',sel.has(b.dataset.id)));
  document.getElementById('desc').innerHTML=[...sel].map(id=>`<div>• <b>${ITEMS[id].n}:</b> ${ITEMS[id].d}</div>`).join('')};
 document.getElementById('labgrid').onclick=e=>{const b=e.target.closest('.item');if(!b)return;const id=b.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);fb.innerHTML='';paint()};
 paint();
 if(done.has(cur)){showResult(st,true);return}
 document.getElementById('tip').onclick=()=>{fb.innerHTML=`<div class="fb ok">Du brauchst ${st.need.length} Dinge aus dem Regal. Lies die Infoseite davor noch einmal: Welche Stoffe und Geräte werden dort genannt?</div>`};
 document.getElementById('go').onclick=()=>{
  const wrong=[...sel].filter(id=>!st.need.includes(id)),miss=st.need.filter(id=>!sel.has(id));
  if(wrong.length){fb.innerHTML=`<div class="fb bad">${wrong.map(id=>`✘ <b>${ITEMS[id].n}</b>: ${ITEMS[id].why||LATER[id]||'Wird in diesem Schritt nicht gebraucht.'}`).join('<br>')}</div>`;return}
  if(miss.length){fb.innerHTML=`<div class="fb bad">Es fehlt noch etwas: ${miss.length===1?'ein Bestandteil':miss.length+' Bestandteile'}. Ohne alle Zutaten läuft die Reaktion nicht.</div>`;return}
  if(st.assign){assign(st);return}
  run(st)}}
function assign(st){const fb=document.getElementById('fb');
 fb.innerHTML=`<div class="fb ok"><b>Fast!</b> Welche Probe bekommt welchen Farbstoff? (Festlegung wie auf dem Arbeitsblatt)<p style="margin:8px 0 0">cDNA aus <b>gesundem Gewebe</b>:</p><div class="choice" data-s="g"><button data-c="g">grün</button><button data-c="r">rot</button></div><p style="margin:4px 0 0">cDNA aus <b>Tumorgewebe</b>:</p><div class="choice" data-s="t"><button data-c="g">grün</button><button data-c="r">rot</button></div><div id="am"></div></div>`;
 const pick={};fb.onclick=e=>{const b=e.target.closest('button');if(!b)return;const w=b.parentElement;w.querySelectorAll('button').forEach(z=>z.className='');b.className='right';pick[w.dataset.s]=b.dataset.c;
  if(pick.g&&pick.t){if(pick.g==='g'&&pick.t==='r'){fb.onclick=null;run(st)}else document.getElementById('am').innerHTML='<p class="r">Nicht ganz: Laut Arbeitsblatt wird gesundes Gewebe grün und Tumorgewebe rot markiert. Wichtig ist vor allem: Beide Proben brauchen verschiedene Farben!</p>'}}}
function run(st){const b=document.querySelector('.bench');const dur=st.dur||4000;
 b.innerHTML=`<div class="run"><div class="${st.anim?'':'shake'}" style="display:inline-block">${st.anim?'':icon('tube','#1f7ae0').replace('<svg','<svg width="90" height="90"')}</div>${st.anim?`<div class="fig">${chipSVG(st.anim)}</div>`:''}<p><b>${st.run}</b></p><div class="bar"><i id="pb"></i></div></div>`;
 const pb=document.getElementById('pb');const t0=performance.now();
 const tick=t=>{const f=Math.min(1,(t-t0)/dur);pb.style.width=f*100+'%';if(f<1)requestAnimationFrame(tick);else{done.add(cur);showResult(st)}};requestAnimationFrame(tick)}
function showResult(st,again){const b=document.querySelector('.bench');
 b.innerHTML=`<div class="task"><b>Auftrag:</b> ${st.task}</div><div class="fb ok">✔ Richtig ausgewählt: ${st.need.map(id=>ITEMS[id].n).join(', ')}.</div>${st.res}`;
 if(st.anim==='hyb')b.insertAdjacentHTML('beforeend',`<div class="fig">${chipSVG('wash')}</div>`);
 NX.disabled=false;dots()}
go(0);
}
</script>
</body>
</html>
